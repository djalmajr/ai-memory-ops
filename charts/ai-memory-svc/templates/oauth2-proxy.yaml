{{- if .Values.oauth2Proxy.enabled }}
{{- /*
  oauth2-proxy — interactive login (OIDC) for browser UIs (/web, /api/v1).
  The mcp-auth validates bearer/JWT (machine clients) but does NOT do browser
  redirects → a browser on a /web protected only by it would see 401. The oauth2-proxy
  redirects to Keycloak, logs in (cookie) and injects the app's bearer into the upstream.

  SENSITIVE secrets stay OUTSIDE git (manual bootstrap, see runbook 08):
    - {{ .Values.oauth2Proxy.configSecretName }} : alpha-config (oauth2-proxy.yaml) + cookie-secret.
      The alpha-config carries clientSecret + static Bearer (injectRequestHeaders) and
      MUST contain `code_challenge_method: S256` in the provider block (the Keycloak
      client requires PKCE; in alpha-config the --code-challenge-method flag is ignored).
    - {{ .Values.oauth2Proxy.caSecretName }} : internal CA (ca.crt) to trust the selfsigned Keycloak.
*/}}
{{- $name := printf "%s-oauth2" (include "ai-memory-svc.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-memory-svc.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-memory-svc.name" . }}-oauth2
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-memory-svc.name" . }}-oauth2
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: oauth2-proxy
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: oauth2-proxy
          image: "{{ .Values.oauth2Proxy.image.repository }}:{{ .Values.oauth2Proxy.image.tag }}"
          imagePullPolicy: {{ .Values.oauth2Proxy.image.pullPolicy }}
          args:
            - --alpha-config=/config/oauth2-proxy.yaml
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2Proxy.configSecretName }}
                  key: cookie-secret
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: {{ .Values.oauth2Proxy.emailDomains | quote }}
            {{- with .Values.oauth2Proxy.redirectUrl }}
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: {{ . | quote }}
            {{- end }}
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: {{ .Values.oauth2Proxy.cookieSecure | quote }}
            {{- with .Values.oauth2Proxy.whitelistDomains }}
            - name: OAUTH2_PROXY_WHITELIST_DOMAINS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oauth2Proxy.cookieDomains }}
            - name: OAUTH2_PROXY_COOKIE_DOMAINS
              value: {{ . | quote }}
            {{- end }}
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: {{ .Values.oauth2Proxy.skipProviderButton | quote }}
            # In alpha-config the --provider-ca-files/env is ignored; Go reads SSL_CERT_FILE.
            - name: SSL_CERT_FILE
              value: {{ .Values.oauth2Proxy.caPath | quote }}
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: ca
              mountPath: /certs
          resources:
            {{- toYaml .Values.oauth2Proxy.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.oauth2Proxy.configSecretName }}
            items:
              - key: oauth2-proxy.yaml
                path: oauth2-proxy.yaml
        - name: ca
          secret:
            secretName: {{ .Values.oauth2Proxy.caSecretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-memory-svc.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4180
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "ai-memory-svc.name" . }}-oauth2
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: oauth2-proxy
{{- end }}
