# Build + push the 5 container images of ai-memory-ops to GHCR.
#
# Targets: ghcr.io/djalmajr/ai-memory-ops/{ai-memory,mcp-auth,etl,contributors,git-mirror}
#
# Triggers:
# - push to main when images/** or this workflow change (auto-rebuild on edits)
# - tag v* (produces a version-tagged image)
# - manual via workflow_dispatch (rebuild any time)
#
# Single-arch (linux/amd64) for now — the target cluster (Hetzner k3s) is amd64.
# Re-enable arm64 by adding it to `platforms` once we actually need it (multi-arch
# roughly doubles build time; ai-memory is Rust, ~15-25 min single-arch on first run).
#
# Caching: GitHub Actions cache (type=gha) keeps buildx layers across runs.

name: build-images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/build-images.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra tag to push (in addition to sha + latest)"
        required: false
        default: ""
      engine_ref:
        description: "ai-memory engine git ref to build (AI_MEMORY_REF build-arg). Only the ai-memory image reads it; the others ignore it. Defaults to the deploy line."
        required: false
        default: "deploy-v2"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ai-memory
            context: images/ai-memory
            dockerfile: images/ai-memory/Dockerfile
          - name: mcp-auth
            context: images/mcp-auth
            dockerfile: images/mcp-auth/Dockerfile
          - name: etl
            context: images/etl
            dockerfile: images/etl/Dockerfile
          - name: contributors
            context: images/contributors
            dockerfile: images/contributors/Dockerfile
          - name: git-mirror
            context: images/git-mirror
            dockerfile: images/git-mirror/Dockerfile
          - name: scope-guard
            context: images/scope-guard
            dockerfile: images/scope-guard/Dockerfile
    name: build ${{ matrix.image.name }}
    steps:
      # All action versions below run on Node.js 24 (the others are pinned
      # to releases that still ship Node 20, which GitHub deprecated as of
      # 2026-06; see the deprecation note on every build log if a version
      # falls behind).
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/djalmajr/ai-memory-ops/${{ matrix.image.name }}
          # Auto-tag map:
          # - branch=main          → tag `latest`
          # - tag v1.2.3           → tags `v1.2.3`, `1.2.3`, `1.2`, `1`
          # - any                  → tag `sha-<short>` (always emitted)
          # - workflow_dispatch    → tag from inputs.tag (when provided)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/djalmajr/ai-memory-ops
            org.opencontainers.image.description=ai-memory-ops ${{ matrix.image.name }}
            org.opencontainers.image.licenses=MIT

      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: true
          # Only the ai-memory Dockerfile declares AI_MEMORY_REF; the other
          # images don't and harmlessly ignore it (buildkit warns, no effect).
          # Empty inputs.engine_ref (push/tag triggers) falls back to deploy-v2,
          # matching the Dockerfile default — so non-dispatch builds are unchanged.
          build-args: |
            AI_MEMORY_REF=${{ github.event.inputs.engine_ref || 'deploy-v2' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
