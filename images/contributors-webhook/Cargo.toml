[package]
name = "contributors-webhook"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Admission webhook for ai-memory: appends contributors (agent/user/client) to page frontmatter as an append-only set."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
