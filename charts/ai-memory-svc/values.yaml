# Default values for ai-memory-svc.
#
# Post-migration topology for ai-memory:
# - Service pod with up to 2 containers:
#     * ai-memory  — single server: MCP HTTP (/mcp), /web, /api/v1, /admin/* (writes), /hook.
#                    Source of truth (writer actor + SQLite WAL). Replaces the MCP server.
#     * mcp-auth   — Go forwardAuth sidecar (Keycloak JWT) — auth gateway.
# - ETL = separate k8s CronJob (templates/cronjob-etl.yaml), one-shot `run` mode; writes to
#   ai-memory via HTTP (Service DNS). Ephemeral pod, scratch on emptyDir (does not share the PVC).
# - The service pod mounts the RWO PVC at /data (wiki/ + db/memory.sqlite). RWO PVC, no RWX.

nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Application config (shared; used mainly by the etl-cron)
# ----------------------------------------------------------------------------
config:
  # Repo of sources to ingest (opencode generates markdown from them in the ETL).
  wiki:
    branch: main
    # Pilot source — first project to ingest (becomes project `my-org/sample-project`).
    sources:
      - name: sample-project
        repoUrl: https://gitlab.example.com/my-org/sample-project.git
        branch: master
  # Language of the content generated by the ETL.
  language: pt-BR
  # OpenCode provider + model used by the ETL to generate the documentation.
  openCode:
    model: opencode-go/kimi-k2.6
    providers:
      opencode-go:
        npm: "@ai-sdk/openai-compatible"
        name: "OpenCode Go"
        options:
          baseURL: "https://opencode.ai/zen/go/v1"
          apiKey: "{env:OPENCODE_API_KEY}"
        models:
          kimi-k2.6:
            name: "Kimi K2.6"

# ----------------------------------------------------------------------------
# Pod (Deployment — replicas fixed at 1; SQLite WAL + single writer actor)
# ----------------------------------------------------------------------------
pod:
  # NOT horizontally scalable — RWO + SQLite + single writer actor.
  replicaCount: 1

# ----------------------------------------------------------------------------
# Monitoring — capacity report of /data
# ----------------------------------------------------------------------------
monitoring:
  capacity:
    enabled: false
    schedule: "0 */6 * * *"
  # Opt-in single-node alerting: a CronJob (bitnami/kubectl) that checks the
  # engine pod for OOMKilled/restarts, sustained 429 ingest saturation, memory
  # pressure, and an external healthcheck, then POSTs to a webhook ONLY when
  # something is wrong. Nothing is applied until enabled=true. Requires a
  # pre-created Secret holding ALERT_WEBHOOK_URL (see webhookSecretName).
  alerts:
    enabled: false
    schedule: "*/5 * * * *"
    since: "6m"                 # log window; keep >= schedule interval
    saturationThreshold: 5      # "ingest saturated" occurrences that trip a 429 alert
    memPctThreshold: 80         # % of the container memory limit (needs metrics-server)
    healthUrl: ""               # default: http://<svc>:<port><basePath>/admin/status
    webhookSecretName: ""       # Secret with key ALERT_WEBHOOK_URL (required when enabled)
    image:
      repository: bitnami/kubectl
      tag: "1.30"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 64Mi

# ----------------------------------------------------------------------------
# ai-memory — single server
# ----------------------------------------------------------------------------
aiMemory:
  image:
    digest: ""            # pin by digest (overrides tag when set)
    repository: ghcr.io/djalmajr/ai-memory-ops/ai-memory
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 49374
  # Canonical workspace (multi-workspace in the future). Projects = ETL sources.
  workspace: my-org
  # Bootstrap project name. The engine ALWAYS creates one project row on
  # boot (`get_or_create_project`); when this is empty it falls back to
  # the hardcoded "scratch", which shows up in the UI as a stray empty
  # project. Set to anything stable (e.g. "default", "system", "_seed")
  # to avoid that. HTTP requests resolve their own project per-request,
  # so this only names the seed row.
  project: ""
  enableWeb: true          # mounts /web (browser) + /api/v1 (read-only)
  webUiDir: ""             # if set, serves a custom static UI at /web (--web-ui-dir)
  # Slug the web UI mounts at WITHIN the base path (AI_MEMORY_WEB_SLUG). Only takes
  # effect in base-path mode (ingress path-based + stripPathPrefix=false). "/web"
  # keeps it at <base>/web; "/" serves it at the base root (<base>). API stays at
  # <base>/api/v1 regardless.
  webSlug: "/web"
  # Boot in migration-tolerant (fork) mode: skip the refinery checksum/order
  # divergence abort when the data-dir was migrated by a different build's
  # migration ordering. Operator escape hatch — leave false for normal installs.
  tolerateMigrationDivergence: false
  httpStateful: false      # stateless by default (curl/simple clients without mcp-remote)
  # Stable username stamped onto every rung-1 (bearer-token) request. When set,
  # `ActorContext.user` becomes this value for any authenticated write; admission
  # webhooks (e.g. scope-guard) see it as the user key. Leave empty in single-
  # operator installs that don't need a named identity; set it before enabling
  # `webhooks.scopeGuard` so the ACL has a non-empty user to match.
  rootUsername: ""
  logLevel: "ai_memory=info,ai_memory_web=info,ai_memory_mcp=info"
  # Host-header allowlist (AI_MEMORY_ALLOWED_HOSTS). MUST include the ingress host
  # (Traefik preserves the original Host when forwarding to the backend).
  allowedHosts:
    - localhost
    - 127.0.0.1
    - "::1"
  # LLM (consolidation) — empty = zero-LLM (rule-based checkpoint, rule-based lint).
  llm:
    provider: ""           # e.g. "openai-compat"
    baseUrl: ""            # e.g. "https://opencode.ai/zen/go"
    model: ""              # e.g. "kimi-k2.6"
  # Embeddings — empty = FTS5-only. HTTP provider (e.g. Ollama OpenAI-compatible).
  embedding:
    provider: ""           # e.g. "openai"
    baseUrl: ""            # e.g. "http://<ollama-host>:11434/v1"
    model: ""              # e.g. "qwen3-embedding:0.6b"
    dim: ""                # e.g. "1024"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1500m
      memory: 2Gi
  # Auto-scope (active project isolation) — how the hook-published
  # "currently active project" pointer is shared across concurrent MCP
  # callers. `single` (default) is the legacy process-wide slot, safe
  # for one-operator installs. `per_session` keys by session_id —
  # isolates concurrent agent runs (Claude Code + Codex + … on the
  # same operator). `per_actor` keys by (user, session_id) — isolates
  # across DB users too, for multi-user installs where several authed
  # operators share one engine.
  #
  # Only the env vars whose values differ from the engine defaults are
  # emitted, so leaving everything at "" keeps the rendered Deployment
  # unchanged from before this knob existed (zero diff in helm upgrade
  # when flipping to mode: single).
  autoScope:
    mode: ""                  # "" | single | per_session | per_actor
    sessionTtlSecs: ""        # default 3600 (1h)
    maxEntries: ""            # default 4096
  # Admission webhook chain — synchronous HTTP hooks invoked inside
  # `Wiki::write_page` just before page persistence. Each entry is a
  # {name,url,timeout_ms,failure_policy,events} object. The chart auto-
  # appends entries for the local `contributors` / `git-mirror` Services
  # when their `webhooks.*.enabled=true` toggles are on (see `_helpers.tpl`),
  # so leave this list empty when using the bundled webhooks. Use this
  # list to register EXTRA webhooks running outside the chart.
  # See engine `crate::admission` for the contract.
  admissionWebhooks: []
  # Example:
  # admissionWebhooks:
  #   - name: my-custom-webhook
  #     url: http://my-webhook.namespace.svc.cluster.local:8080/notify
  #     timeout_ms: 10000
  #     failure_policy: ignore
  #     events: [write_page, consolidate]

# ----------------------------------------------------------------------------
# Admission webhooks — bundled extensions that plug into the engine via the
# admission webhook chain. Each is independently toggleable; the engine has
# ZERO knowledge of any specific webhook (OCP: engine closed for modification,
# extensions open via plug-and-play HTTP services).
# ----------------------------------------------------------------------------
webhooks:
  # `scope-guard` — write-side ACL admission webhook. Engine sends every
  # write/delete/consolidate/move through this hook FIRST (failure_policy:
  # reject is forced when enabled, see `_helpers.tpl scopeGuardEntry`).
  # Each rule is `{workspace: <regex>, project: <regex>}`, auto-anchored
  # with ^…$. The wildcard user `*` applies to every caller in addition
  # to their own rules. Reads are NOT gated — engine has no read
  # admission chain.
  #
  # Defaults: enabled=false, rules={} (empty ACL → deny-by-default; the
  # pod starts but every write is rejected until an operator populates
  # `rules` and reruns `helm upgrade`).
  scopeGuard:
    enabled: false
    image:
      digest: ""            # pin by digest (overrides tag when set)
      repository: ghcr.io/djalmajr/ai-memory-ops/scope-guard
      tag: latest
      pullPolicy: IfNotPresent
    port: 8080
    logLevel: info          # debug | info | warn | error
    timeoutMs: 2000
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 64Mi
    # ACL — keys are usernames (from `ai-memory user add` or the
    # configured root_username). Use `*` to grant a scope to every
    # caller. Empty `rules: {}` (the default) rejects every write —
    # set this before enabling in prod.
    #
    # Example:
    # rules:
    #   djalmajr:   [{ workspace: "djalmajr|shared", project: ".*" }]
    #   cit-people: [{ workspace: "cit-people|shared", project: ".*" }]
    #   "*":        [{ workspace: "public", project: ".*" }]
    rules: {}

  # `contributors` — appends actor identity (agent/user/client) to
  # frontmatter.contributors as an append-only set keyed by (agent,client).
  # When enabled, the helper auto-registers the URL in the engine's
  # admissionWebhooks list (no manual wiring needed).
  contributors:
    enabled: false
    image:
      repository: ghcr.io/djalmajr/ai-memory-ops/contributors
      tag: latest
      pullPolicy: IfNotPresent
    port: 8080
    logLevel: info          # debug | info | warn | error
    timeoutMs: 2000
    failurePolicy: ignore   # ignore | reject
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 64Mi

  # `git-mirror` — mirrors every page write into an external git repo
  # (durable backup). Requires an SSH deploy key Secret (default name:
  # `<release>-git-mirror-ssh`) with two keys: `id_ed25519` (private key)
  # and `known_hosts` (the remote host fingerprint). The helper auto-
  # registers the webhook URL when enabled.
  gitMirror:
    enabled: false
    image:
      repository: ghcr.io/djalmajr/ai-memory-ops/git-mirror
      tag: latest
      pullPolicy: IfNotPresent
    port: 8080
    logLevel: info
    timeoutMs: 2000
    failurePolicy: ignore
    # Fire-and-forget delivery (default). The mirror only copies pages, so
    # the engine dispatches the webhook AFTER the write without awaiting the
    # git push — keeps writes (and bulk migrations like move-project) fast.
    # Set true to make writes block until the mirror responds.
    blocking: false
    # Auth mode. `ssh` (default) mounts a Secret with id_ed25519 +
    # known_hosts at /etc/git-ssh. `https` skips SSH wiring entirely —
    # in that case embed credentials directly in repoUrl (or use
    # repoUrlSecret to keep the token out of `helm get values`).
    auth: ssh   # ssh | https
    # REPO_URL — provide ONE of:
    #   repoUrl:        literal string (visible in `helm get values`/env)
    #   repoUrlSecret:  { name, key } — read from a pre-existing Secret
    # When `auth: https` the URL should include credentials, e.g.
    #   https://oauth2:<token>@gitlab.example.com/owner/repo.git
    repoUrl: ""
    repoUrlSecret: {}
    repoBranch: main
    # How long to wait for further commits before issuing `git push`.
    # Lower = fresher backup; higher = fewer pushes / less remote chatter.
    pushDebounce: 10s
    # Readiness (/healthz) reports 503 once there is a LIVE push-failure
    # backlog whose last success is older than this. An idle mirror (no
    # writes) never trips it. Also the threshold the staleness alert keys off.
    staleFailThreshold: 15m
    # Backup reconciliation (opt-in): every reconcileInterval, ask the engine
    # for its authoritative project list (GET /admin/projects) and prune any
    # backup `wiki/<ws>/<proj>` dir whose project no longer exists — orphans
    # left by a purge that bypassed the admission chain (a CLI --data-dir
    # purge, a direct DB op). FAIL-SAFE: a failed/empty engine response prunes
    # nothing. Requires BOTH reconcileInterval AND engineUrl to activate.
    reconcileInterval: ""              # e.g. "1h"; empty = disabled
    engineUrl: ""                      # e.g. http://memory-v2-wiki-service:49374
    engineHostHeader: localhost        # Host header (engine allowedHosts gate)
    engineTokenSecret: {}              # { name, key } — Secret with the engine bearer token
    # Name of the pre-existing Secret with the SSH deploy key. Default
    # follows the chart fullname pattern; override if you create the
    # secret with a custom name.
    sshSecret: ""
    git:
      userName: "ai-memory git-mirror"
      userEmail: "git-mirror@ai-memory.local"
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 300m
        memory: 128Mi

# ----------------------------------------------------------------------------
# ETL — k8s CronJob (templates/cronjob-etl.yaml). etl image in one-shot `run`
# mode: opencode generates markdown and writes to ai-memory via HTTP
# (/admin/write-page, through the Service DNS). It is NO LONGER a sidecar/supercronic.
# Triggerable on-demand: kubectl create job --from=cronjob/<fullname>-etl
# ----------------------------------------------------------------------------
etl:
  enabled: true
  schedule: "0 0 * * *"             # daily at 00:00 (.spec.schedule of the CronJob)
  suspend: false                    # true = on-demand only (scheduling stopped)
  image:
    repository: ghcr.io/djalmajr/ai-memory-ops/etl
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 4Gi
  # If true, triggers `ai-memory embed` at the end (requires embeddings configured).
  runIndexer: true
  # Git identity used by opencode/auxiliary commits (when applicable).
  git:
    userName: "ai-memory-bot"
    userEmail: "ai-memory-bot@example.com"

# ----------------------------------------------------------------------------
# Persistence (RWO PVC — ai-memory data dir: wiki/ git + db/memory.sqlite)
# ----------------------------------------------------------------------------
persistence:
  accessMode: ReadWriteOnce
  storageClass: ""
  size: 20Gi

# ----------------------------------------------------------------------------
# MCP Auth sidecar — forwardAuth gateway (Keycloak JWT).
#
# Beyond validating the JWT (JWKS), the roadmap plans to serve OAuth
# protected resource metadata (RFC 9728) + 401 challenge — a change in the
# images/mcp-auth code, not in the chart.
# ----------------------------------------------------------------------------
mcpAuth:
  enabled: false                                    # true when Keycloak + ingress are ready
  image:
    repository: ghcr.io/djalmajr/ai-memory-ops/mcp-auth
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 8081
  oidc:
    issuer: ""                                      # REQUIRED when enabled
    audience: ""
  jwksRefreshSeconds: 300
  logLevel: "info"
  # OAuth protected resource (RFC 9728). When enabled, the
  # mcp-auth serves the metadata (dedicated Traefik route, without forwardAuth) and emits
  # WWW-Authenticate on 401 → the MCP client does Auth Code + PKCE on Keycloak.
  oauth:
    enabled: false
    resource: ""                                    # e.g. "https://platform.example.com/wiki/mcp"
    metadataUrl: ""                                 # e.g. "https://platform.example.com/wiki/.well-known/oauth-protected-resource"
    scopes: "mcp:read mcp:write"
  # Authorization Server metadata alias (RFC 8414 / OIDC discovery). Aliases the AS
  # metadata at the host ROOT and the RFC-8414 path-inserted location to the Keycloak
  # realm, so MCP OAuth clients that drop the path-based issuer (Codex, OMP, mcp-remote)
  # can discover it. Deploys an Ingress INTO the Keycloak namespace (nginx backends must
  # be same-namespace); the release SA needs Ingress rights there. nginx only. The realm
  # path is derived from mcpAuth.oidc.issuer. See gotcha mcp-oauth-path-based-issuer.
  authServerMetadataAlias:
    enabled: false
    namespace: ""            # Keycloak's namespace (where this Ingress lands)
    service: ""              # Keycloak HTTP service name in that namespace
    servicePort: http        # port name (e.g. "http") or number (e.g. 80)
    tlsSecretName: ""         # TLS secret for ingress.host, IN the keycloak namespace
  # Lifecycle-hook token — static bearer accepted ONLY on /hook and /handoff
  # (agent hooks are headless and cannot run an interactive OAuth flow). The
  # token itself lives in the external Secret <release>-secrets under the
  # OPTIONAL key HOOK_AUTH_TOKEN: absent key = feature off, JWT-only behavior.
  hookAuth:
    username: ""                                    # propagated as X-Memory-Actor-User on hook-token requests
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# ----------------------------------------------------------------------------
# oauth2-proxy — interactive login (OIDC/Keycloak) for browser UIs.
#
# The mcp-auth validates bearer/JWT (machine clients) but does NOT do browser
# redirects. For /web (and /api/v1) in a browser, the oauth2-proxy redirects to
# Keycloak, logs in (cookie) and injects the app's bearer into the upstream (alpha-config
# injectRequestHeaders). See infra runbook 07/08.
#
# SENSITIVE secrets stay OUTSIDE git (manual bootstrap):
#   - configSecretName: Secret with `oauth2-proxy.yaml` (alpha-config) + `cookie-secret` (openssl rand -hex 16).
#   - caSecretName: Secret with `ca.crt` (internal CA to trust the selfsigned Keycloak).
#
# ⚠️ alpha-config gotcha: fields with a default in legacy mode are NOT populated —
# the oauth2-proxy.yaml MUST set explicitly, in the OIDC provider:
#   code_challenge_method: S256   (the Keycloak client requires PKCE → otherwise 403 invalid_request)
#   oidcConfig.audienceClaims: [aud]            (otherwise 500 "audience claims [] do not exist")
#   oidcConfig.emailClaim/userIDClaim: email
# and the env SSL_CERT_FILE=/certs/ca.crt (--provider-ca-files is ignored in alpha-config).
# See infra runbook 08 for the full bootstrap example.
# ----------------------------------------------------------------------------
oauth2Proxy:
  enabled: false
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.7.1
    pullPolicy: IfNotPresent
  configSecretName: oauth2-proxy-config   # external: oauth2-proxy.yaml + cookie-secret
  caSecretName: oauth2-proxy-ca           # external: ca.crt
  redirectUrl: ""                         # e.g. https://memory.example.com/oauth2/callback
  # Keycloak's access+id+refresh tokens push the encrypted oauth2-proxy
  # session past 4 KB, so the proxy splits it into multiple
  # `_oauth2_proxy_N` cookies. The /oauth2/callback response then ships 4+
  # large `Set-Cookie` headers that overflow nginx-ingress's default 4 KB
  # `proxy_buffer_size` → 502 Bad Gateway at the very last step of the
  # login. 16k × 4 buffers comfortably absorbs ~64 KB of response headers
  # (well above what Keycloak emits in practice). Only takes effect when
  # the ingress backend is nginx AND oauth2Proxy is on; disable here if
  # the operator already sets the buffers globally on the ingress
  # controller and prefers to keep per-Ingress annotations minimal.
  nginxBuffers:
    enabled: true
    size: "16k"
    number: 4
  emailDomains: "*"
  cookieDomains: ""                       # e.g. memory.example.com
  whitelistDomains: ""                    # e.g. memory.example.com
  cookieSecure: true
  skipProviderButton: true
  caPath: /certs/ca.crt                   # SSL_CERT_FILE (--provider-ca-files is ignored in alpha-config)
  # Routes routed to the oauth2-proxy (Traefik IngressRoute, priority > Ingress base "/").
  # /oauth2 is mandatory (callback + sign_in). /web and /api/v1 = browser UI.
  routePrefixes:
    - /oauth2
    - /web
    - /api/v1
  routePriority: 100
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# ----------------------------------------------------------------------------
# Optional one-time Keycloak realm bootstrap (clients + roles + group).
# OFF by default — most operators run scripts/kc-bootstrap.sh by hand via
# `kubectl exec` into the Keycloak pod (see KEYCLOAK-BOOTSTRAP.md). Enable this
# to run the SAME idempotent script as a post-install/post-upgrade Helm hook Job.
# ----------------------------------------------------------------------------
keycloakBootstrap:
  enabled: false
  # kcadm base URL reachable from the cluster, incl. any legacy /auth suffix
  # (e.g. http://keycloak.<ns>.svc:8080  or  .../auth).
  serverUrl: ""
  realm: ""               # target realm (the realm in mcpAuth.oidc.issuer)
  publicUrl: ""           # public base URL incl. base path, no trailing slash
                          # (e.g. https://host  or  https://host/wiki)
  group: ai-memory        # realm group that carries mcp:read/mcp:write
  # Override the client ids (default to the script's: ai-memory-oauth2-proxy,
  # ai-memory-mcp, ai-memory-cli) — e.g. when several instances share one realm.
  oauth2ClientId: ""
  mcpClientId: ""
  deviceClientId: ""
  # An image shipping /opt/keycloak/bin/kcadm.sh (typically your Keycloak image).
  image: ""
  imagePullPolicy: IfNotPresent
  # Existing secret holding the master-realm admin credentials (never templated
  # into the manifest — referenced via secretKeyRef).
  adminSecret:
    name: ""
    userKey: KEYCLOAK_ADMIN
    passwordKey: KEYCLOAK_ADMIN_PASSWORD

# ----------------------------------------------------------------------------
# RBAC scoped for deploy via CI: it is NOT in the chart (it would be circular — the helm run
# by the SA itself would need to manage rbac.* resources, which K8s blocks as escalation).
# Applied at bootstrap by an admin: deploy/rbac-deployer.yaml. See infra runbook 08.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Service (ClusterIP in front of ai-memory)
# ----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 49374
  # Port of the internal validator (accessed by Traefik forwardAuth) — only when mcpAuth.enabled.
  authPort: 8081

# ----------------------------------------------------------------------------
# Ingress (public; auth via forwardAuth/Keycloak; TLS optional)
# ----------------------------------------------------------------------------
ingress:
  enabled: false
  # auto | traefik | nginx. `auto` (default) detects Traefik by checking for the
  # traefik.io/v1alpha1 CRD in the cluster and falls back to nginx otherwise — the
  # same chart works on a Traefik lab and an nginx-only cluster with no value change.
  # The edge-auth wiring (mcp-auth + oauth2-proxy) is rendered for the RESOLVED
  # backend: Traefik Middleware/IngressRoute, or nginx external-auth annotations.
  className: auto
  host: ""
  path: /
  # ai-memory exposes /mcp, /web, /api/v1 at the root → with path=/wiki, stripPathPrefix=true.
  stripPathPrefix: false
  maxBodySize: ""
  # Edge rate-limit on the engine HTTP surface. Protects the engine from a client
  # flood (e.g. a swarm/agent spraying hook captures at /hook) that would otherwise
  # buffer enough request bodies to OOM it — excess is 429'd at the ingress BEFORE
  # reaching the engine. Backend-aware:
  #  - Traefik: a rateLimit Middleware appended to the catch-all router chain (the
  #    chart uses one catch-all Ingress per host, so this is host-global; fine for a
  #    single-operator instance). period+average = sustained req/s; burst = bucket.
  #  - nginx: limit-rps + limit-burst-multiplier on the /hook Ingress only (the
  #    machine ingest path), where the chart already splits routes per path.
  rateLimit:
    enabled: false
    average: 50        # sustained req/s (Traefik average per period; nginx limit-rps)
    burst: 150         # Traefik burst bucket
    period: 1s         # Traefik rateLimit period
    nginxBurstMultiplier: 5   # nginx limit-burst-multiplier on /hook (burst = rps * this)
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# ----------------------------------------------------------------------------
# Secrets — empty values by default. Provision via `kubectl create secret`
# externally (see runbooks/secrets-bootstrap.md).
# ----------------------------------------------------------------------------
secrets:
  # If create=true, the chart creates the Secret from the literals below (dev only).
  create: false
  gitlabToken: ""        # GITLAB_API_TOKEN (ETL: clone of the sources)
  openCodeKey: ""        # OPENCODE_API_KEY (ETL: opencode)
  aiMemoryAuthToken: ""  # AI_MEMORY_AUTH_TOKEN (2nd layer; empty = off behind the gateway)
  llmApiKey: ""          # LLM_API_KEY (ai-memory consolidation)
  embeddingApiKey: ""    # OPENAI_API_KEY (ai-memory embeddings, if the provider requires)

imagePullSecrets: []
