{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-memory-svc.secretName" . }}
  labels:
    {{- include "ai-memory-svc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.gitlabToken }}
  GITLAB_API_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openCodeKey }}
  OPENCODE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.aiMemoryAuthToken }}
  AI_MEMORY_AUTH_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.llmApiKey }}
  LLM_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.embeddingApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
