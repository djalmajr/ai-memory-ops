# Default values for ai-memory-svc.
#
# Post-migration topology for ai-memory:
# - Service pod with up to 2 containers:
#     * ai-memory  — single server: MCP HTTP (/mcp), /web, /api/v1, /admin/* (writes), /hook.
#                    Source of truth (writer actor + SQLite WAL). Replaces the MCP server.
#     * mcp-auth   — Go forwardAuth sidecar (Keycloak JWT) — auth gateway.
# - ETL = separate k8s CronJob (templates/cronjob-etl.yaml), one-shot `run` mode; writes to
#   ai-memory via HTTP (Service DNS). Ephemeral pod, scratch on emptyDir (does not share the PVC).
# - The service pod mounts the RWO PVC at /data (wiki/ + db/memory.sqlite). RWO PVC, no RWX.

nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Application config (shared; used mainly by the etl-cron)
# ----------------------------------------------------------------------------
config:
  # Repo of sources to ingest (opencode generates markdown from them in the ETL).
  wiki:
    branch: main
    # Pilot source — first project to ingest (becomes project `my-org/sample-project`).
    sources:
      - name: sample-project
        repoUrl: https://gitlab.example.com/my-org/sample-project.git
        branch: master
  # Language of the content generated by the ETL.
  language: pt-BR
  # OpenCode provider + model used by the ETL to generate the documentation.
  openCode:
    model: opencode-go/kimi-k2.6
    providers:
      opencode-go:
        npm: "@ai-sdk/openai-compatible"
        name: "OpenCode Go"
        options:
          baseURL: "https://opencode.ai/zen/go/v1"
          apiKey: "{env:OPENCODE_API_KEY}"
        models:
          kimi-k2.6:
            name: "Kimi K2.6"

# ----------------------------------------------------------------------------
# Pod (Deployment — replicas fixed at 1; SQLite WAL + single writer actor)
# ----------------------------------------------------------------------------
pod:
  # NOT horizontally scalable — RWO + SQLite + single writer actor.
  replicaCount: 1

# ----------------------------------------------------------------------------
# Monitoring — capacity report of /data
# ----------------------------------------------------------------------------
monitoring:
  capacity:
    enabled: false
    schedule: "0 */6 * * *"

# ----------------------------------------------------------------------------
# ai-memory — single server
# ----------------------------------------------------------------------------
aiMemory:
  image:
    repository: registry.example.com/my-org/ai-memory
    tag: "0.1.3"
    pullPolicy: IfNotPresent
  port: 49374
  # Canonical workspace (multi-workspace in the future). Projects = ETL sources.
  workspace: my-org
  enableWeb: true          # mounts /web (browser) + /api/v1 (read-only)
  webUiDir: ""             # if set, serves a custom static UI at /web (--web-ui-dir)
  httpStateful: false      # stateless by default (curl/simple clients without mcp-remote)
  logLevel: "ai_memory=info,ai_memory_web=info,ai_memory_mcp=info"
  # Host-header allowlist (AI_MEMORY_ALLOWED_HOSTS). MUST include the ingress host
  # (Traefik preserves the original Host when forwarding to the backend).
  allowedHosts:
    - localhost
    - 127.0.0.1
    - "::1"
  # LLM (consolidation) — empty = zero-LLM (rule-based checkpoint, rule-based lint).
  llm:
    provider: ""           # e.g. "openai-compat"
    baseUrl: ""            # e.g. "https://opencode.ai/zen/go"
    model: ""              # e.g. "kimi-k2.6"
  # Embeddings — empty = FTS5-only. HTTP provider (e.g. Ollama OpenAI-compatible).
  embedding:
    provider: ""           # e.g. "openai"
    baseUrl: ""            # e.g. "http://<ollama-host>:11434/v1"
    model: ""              # e.g. "qwen3-embedding:0.6b"
    dim: ""                # e.g. "1024"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1500m
      memory: 2Gi
  # Admission webhook chain — synchronous HTTP hooks invoked inside
  # `Wiki::write_page` just before page persistence. Each entry is a
  # {name,url,timeout_ms,failure_policy,events} object. The chart auto-
  # appends entries for the local `contributors` / `git-mirror` Services
  # when their `webhooks.*.enabled=true` toggles are on (see `_helpers.tpl`),
  # so leave this list empty when using the bundled webhooks. Use this
  # list to register EXTRA webhooks running outside the chart.
  # See engine `crate::admission` for the contract.
  admissionWebhooks: []
  # Example:
  # admissionWebhooks:
  #   - name: my-custom-webhook
  #     url: http://my-webhook.namespace.svc.cluster.local:8080/notify
  #     timeout_ms: 10000
  #     failure_policy: ignore
  #     events: [write_page, consolidate]

# ----------------------------------------------------------------------------
# Admission webhooks — bundled extensions that plug into the engine via the
# admission webhook chain. Each is independently toggleable; the engine has
# ZERO knowledge of any specific webhook (OCP: engine closed for modification,
# extensions open via plug-and-play HTTP services).
# ----------------------------------------------------------------------------
webhooks:
  # `contributors` — appends actor identity (agent/user/client) to
  # frontmatter.contributors as an append-only set keyed by (agent,client).
  # When enabled, the helper auto-registers the URL in the engine's
  # admissionWebhooks list (no manual wiring needed).
  contributors:
    enabled: false
    image:
      repository: ghcr.io/djalmajr/ai-memory-ops/contributors
      tag: latest
      pullPolicy: IfNotPresent
    port: 8080
    logLevel: info          # debug | info | warn | error
    timeoutMs: 2000
    failurePolicy: ignore   # ignore | reject
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 64Mi

  # `git-mirror` — mirrors every page write into an external git repo
  # (durable backup). Requires an SSH deploy key Secret (default name:
  # `<release>-git-mirror-ssh`) with two keys: `id_ed25519` (private key)
  # and `known_hosts` (the remote host fingerprint). The helper auto-
  # registers the webhook URL when enabled.
  gitMirror:
    enabled: false
    image:
      repository: ghcr.io/djalmajr/ai-memory-ops/git-mirror
      tag: latest
      pullPolicy: IfNotPresent
    port: 8080
    logLevel: info
    timeoutMs: 2000
    failurePolicy: ignore
    # REQUIRED when enabled. SSH-only ("git@…:…" form). HTTPS auth isn't
    # wired up (would need a different secret-mount + GIT_ASKPASS path).
    repoUrl: ""
    repoBranch: main
    # How long to wait for further commits before issuing `git push`.
    # Lower = fresher backup; higher = fewer pushes / less remote chatter.
    pushDebounce: 10s
    # Name of the pre-existing Secret with the SSH deploy key. Default
    # follows the chart fullname pattern; override if you create the
    # secret with a custom name.
    sshSecret: ""
    git:
      userName: "ai-memory git-mirror"
      userEmail: "git-mirror@ai-memory.local"
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 300m
        memory: 128Mi

# ----------------------------------------------------------------------------
# ETL — k8s CronJob (templates/cronjob-etl.yaml). etl image in one-shot `run`
# mode: opencode generates markdown and writes to ai-memory via HTTP
# (/admin/write-page, through the Service DNS). It is NO LONGER a sidecar/supercronic.
# Triggerable on-demand: kubectl create job --from=cronjob/<fullname>-etl
# ----------------------------------------------------------------------------
etl:
  enabled: true
  schedule: "0 0 * * *"             # daily at 00:00 (.spec.schedule of the CronJob)
  suspend: false                    # true = on-demand only (scheduling stopped)
  image:
    repository: gitlab.example.com/my-org/ai-memory-content/ai-memory-svc-etl
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 4Gi
  # If true, triggers `ai-memory embed` at the end (requires embeddings configured).
  runIndexer: true
  # Git identity used by opencode/auxiliary commits (when applicable).
  git:
    userName: "ai-memory-bot"
    userEmail: "ai-memory-bot@example.com"

# ----------------------------------------------------------------------------
# Persistence (RWO PVC — ai-memory data dir: wiki/ git + db/memory.sqlite)
# ----------------------------------------------------------------------------
persistence:
  accessMode: ReadWriteOnce
  storageClass: ""
  size: 20Gi

# ----------------------------------------------------------------------------
# MCP Auth sidecar — forwardAuth gateway (Keycloak JWT).
#
# Beyond validating the JWT (JWKS), the roadmap plans to serve OAuth
# protected resource metadata (RFC 9728) + 401 challenge — a change in the
# images/mcp-auth code, not in the chart.
# ----------------------------------------------------------------------------
mcpAuth:
  enabled: false                                    # true when Keycloak + ingress are ready
  image:
    repository: registry.example.com/my-org/ai-memory-svc-mcp-auth
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 8081
  oidc:
    issuer: ""                                      # REQUIRED when enabled
    audience: ""
  jwksRefreshSeconds: 300
  logLevel: "info"
  # OAuth protected resource (RFC 9728). When enabled, the
  # mcp-auth serves the metadata (dedicated Traefik route, without forwardAuth) and emits
  # WWW-Authenticate on 401 → the MCP client does Auth Code + PKCE on Keycloak.
  oauth:
    enabled: false
    resource: ""                                    # e.g. "https://platform.example.com/wiki/mcp"
    metadataUrl: ""                                 # e.g. "https://platform.example.com/wiki/.well-known/oauth-protected-resource"
    scopes: "mcp:read mcp:write"
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# ----------------------------------------------------------------------------
# oauth2-proxy — interactive login (OIDC/Keycloak) for browser UIs.
#
# The mcp-auth validates bearer/JWT (machine clients) but does NOT do browser
# redirects. For /web (and /api/v1) in a browser, the oauth2-proxy redirects to
# Keycloak, logs in (cookie) and injects the app's bearer into the upstream (alpha-config
# injectRequestHeaders). See infra runbook 07/08.
#
# SENSITIVE secrets stay OUTSIDE git (manual bootstrap):
#   - configSecretName: Secret with `oauth2-proxy.yaml` (alpha-config) + `cookie-secret` (openssl rand -hex 16).
#   - caSecretName: Secret with `ca.crt` (internal CA to trust the selfsigned Keycloak).
#
# ⚠️ alpha-config gotcha: fields with a default in legacy mode are NOT populated —
# the oauth2-proxy.yaml MUST set explicitly, in the OIDC provider:
#   code_challenge_method: S256   (the Keycloak client requires PKCE → otherwise 403 invalid_request)
#   oidcConfig.audienceClaims: [aud]            (otherwise 500 "audience claims [] do not exist")
#   oidcConfig.emailClaim/userIDClaim: email
# and the env SSL_CERT_FILE=/certs/ca.crt (--provider-ca-files is ignored in alpha-config).
# See infra runbook 08 for the full bootstrap example.
# ----------------------------------------------------------------------------
oauth2Proxy:
  enabled: false
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.7.1
    pullPolicy: IfNotPresent
  configSecretName: oauth2-proxy-config   # external: oauth2-proxy.yaml + cookie-secret
  caSecretName: oauth2-proxy-ca           # external: ca.crt
  redirectUrl: ""                         # e.g. https://memory.example.com/oauth2/callback
  emailDomains: "*"
  cookieDomains: ""                       # e.g. memory.example.com
  whitelistDomains: ""                    # e.g. memory.example.com
  cookieSecure: true
  skipProviderButton: true
  caPath: /certs/ca.crt                   # SSL_CERT_FILE (--provider-ca-files is ignored in alpha-config)
  # Routes routed to the oauth2-proxy (Traefik IngressRoute, priority > Ingress base "/").
  # /oauth2 is mandatory (callback + sign_in). /web and /api/v1 = browser UI.
  routePrefixes:
    - /oauth2
    - /web
    - /api/v1
  routePriority: 100
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# ----------------------------------------------------------------------------
# RBAC scoped for deploy via CI: it is NOT in the chart (it would be circular — the helm run
# by the SA itself would need to manage rbac.* resources, which K8s blocks as escalation).
# Applied at bootstrap by an admin: deploy/rbac-deployer.yaml. See infra runbook 08.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Service (ClusterIP in front of ai-memory)
# ----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 49374
  # Port of the internal validator (accessed by Traefik forwardAuth) — only when mcpAuth.enabled.
  authPort: 8081

# ----------------------------------------------------------------------------
# Ingress (public; auth via forwardAuth/Keycloak; TLS optional)
# ----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  # ai-memory exposes /mcp, /web, /api/v1 at the root → with path=/wiki, stripPathPrefix=true.
  stripPathPrefix: false
  maxBodySize: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# ----------------------------------------------------------------------------
# Secrets — empty values by default. Provision via `kubectl create secret`
# externally (see runbooks/secrets-bootstrap.md).
# ----------------------------------------------------------------------------
secrets:
  # If create=true, the chart creates the Secret from the literals below (dev only).
  create: false
  gitlabToken: ""        # GITLAB_API_TOKEN (ETL: clone of the sources)
  openCodeKey: ""        # OPENCODE_API_KEY (ETL: opencode)
  aiMemoryAuthToken: ""  # AI_MEMORY_AUTH_TOKEN (2nd layer; empty = off behind the gateway)
  llmApiKey: ""          # LLM_API_KEY (ai-memory consolidation)
  embeddingApiKey: ""    # OPENAI_API_KEY (ai-memory embeddings, if the provider requires)

imagePullSecrets: []
