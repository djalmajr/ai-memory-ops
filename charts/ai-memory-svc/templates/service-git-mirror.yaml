{{- if and .Values.webhooks.gitMirror .Values.webhooks.gitMirror.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-memory-svc.gitMirrorFullname" . }}
  labels:
    {{- include "ai-memory-svc.labels" . | nindent 4 }}
    app.kubernetes.io/component: git-mirror
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.webhooks.gitMirror.port | default 8080 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ai-memory-svc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: git-mirror
{{- end }}
