apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-memory-svc.fullname" . }}
  labels:
    {{- include "ai-memory-svc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.mcpAuth.enabled }}
    - port: {{ .Values.service.authPort | default 8081 }}
      targetPort: auth-http
      protocol: TCP
      name: auth-http
    {{- end }}
  selector:
    {{- include "ai-memory-svc.selectorLabels" . | nindent 4 }}
