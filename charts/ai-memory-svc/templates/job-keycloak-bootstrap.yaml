{{- /*
Optional one-time Keycloak realm bootstrap as a post-install/post-upgrade Helm
hook Job (keycloakBootstrap.enabled). Runs the SAME scripts/kc-bootstrap.sh that
the by-hand `kubectl exec` path uses. Idempotent. OFF by default — see
KEYCLOAK-BOOTSTRAP.md. All instance-specific values come from .Values; admin
credentials come from an existing secret (never templated into the manifest).
*/ -}}
{{- if .Values.keycloakBootstrap.enabled }}
{{- $kb := .Values.keycloakBootstrap }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-memory-svc.fullname" . }}-keycloak-bootstrap
  labels:
    {{- include "ai-memory-svc.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "ai-memory-svc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-bootstrap
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kc-bootstrap
          image: {{ required "keycloakBootstrap.image is required when keycloakBootstrap.enabled=true (an image shipping /opt/keycloak/bin/kcadm.sh)" $kb.image | quote }}
          imagePullPolicy: {{ $kb.imagePullPolicy | default "IfNotPresent" }}
          command: ["sh", "/scripts/kc-bootstrap.sh"]
          env:
            - name: KC_SERVER
              value: {{ required "keycloakBootstrap.serverUrl is required" $kb.serverUrl | quote }}
            - name: KC_REALM
              value: {{ required "keycloakBootstrap.realm is required" $kb.realm | quote }}
            - name: PUBLIC_URL
              value: {{ required "keycloakBootstrap.publicUrl is required" $kb.publicUrl | quote }}
            - name: GROUP
              value: {{ $kb.group | default "ai-memory" | quote }}
            {{- with $kb.oauth2ClientId }}
            - name: OAUTH2_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with $kb.mcpClientId }}
            - name: MCP_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with $kb.deviceClientId }}
            - name: DEVICE_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "keycloakBootstrap.adminSecret.name is required" $kb.adminSecret.name | quote }}
                  key: {{ $kb.adminSecret.userKey | default "KEYCLOAK_ADMIN" | quote }}
            - name: KC_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $kb.adminSecret.name | quote }}
                  key: {{ $kb.adminSecret.passwordKey | default "KEYCLOAK_ADMIN_PASSWORD" | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts/kc-bootstrap.sh
              subPath: kc-bootstrap.sh
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: {{ include "ai-memory-svc.fullname" . }}-keycloak-bootstrap
            defaultMode: 0755
{{- end }}
